version: '3.9'

services:
  postgres:
    container_name: 'infinite-chat-postgres'
    image: postgres:16-alpine
    restart: always
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    ports:
      - 5433:5432
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - infinite-chat-postgres

volumes:
  postgres_data:

networks:
  infinite-chat-postgres:
